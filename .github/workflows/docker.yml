name: Image Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "deploy/**"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les piles compose
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f deploy/portainer/stack.yml --env-file .env.example config --quiet

      - uses: docker/setup-buildx-action@v3

      # Les pull requests construisent sans publier : le Dockerfile reste vérifié.
      - name: Se connecter à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Contrôle de bout en bout : l'image sauvegarde, liste, restaure.
      - name: Essayer l'image
        if: github.event_name == 'pull_request'
        run: |
          set -eux
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          mkdir -p /tmp/essai/sources /tmp/essai/repository /tmp/essai/restauration
          echo bonjour > /tmp/essai/sources/a.txt
          docker run --rm \
            -e HEAVEN_SOURCES=/sources -e HEAVEN_REPOSITORY=/repository \
            -e HEAVEN_STATE=/repository/state.json \
            -v /tmp/essai/sources:/sources:ro \
            -v /tmp/essai/repository:/repository \
            "$image" serve --once --schedule 6h --verify-every 1
          docker run --rm -v /tmp/essai/repository:/repository "$image" \
            snapshots --repository /repository
          docker run --rm -v /tmp/essai/repository:/repository "$image" \
            health --state-file /repository/state.json
          docker run --rm \
            -v /tmp/essai/repository:/repository \
            -v /tmp/essai/restauration:/restauration \
            "$image" restore latest --repository /repository --target /restauration
          grep -qx bonjour /tmp/essai/restauration/sources/a.txt
