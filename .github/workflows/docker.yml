name: Image Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "web/**"
      - "deploy/**"
      - "docker-compose.runner.yml"
      - "scripts/**"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les piles compose
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f deploy/portainer/stack.yml --env-file .env.example config --quiet
          GH_RUNNER_TOKEN=verification docker compose -f docker-compose.runner.yml config --quiet

      # Le déploiement tourne sur un runner auto-hébergé, hors de portée d'ici :
      # ce qui peut être éprouvé sur un runner GitHub l'est, faute de quoi une
      # faute de frappe dans ces scripts ne se verrait que sur la machine de
      # déploiement, au moment du déploiement.
      - name: Vérifier les scripts de déploiement
        run: |
          bash -n scripts/portainer-stack.sh
          bash -n scripts/ci-deploy.sh
          ./scripts/portainer-stack.sh selftest

      - uses: docker/setup-buildx-action@v3

      # Les pull requests construisent sans publier : le Dockerfile reste vérifié.
      - name: Se connecter à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Contrôle de bout en bout : l'image sauvegarde, liste, restaure.
      - name: Essayer l'image
        if: github.event_name == 'pull_request'
        run: |
          set -eux
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          mkdir -p /tmp/essai/sources /tmp/essai/repository /tmp/essai/etat /tmp/essai/restauration
          echo bonjour > /tmp/essai/sources/a.txt
          # Volumes disposés comme dans l'image : dépôt et état séparés, et
          # aucune variable de configuration — ce sont les défauts qui sont éprouvés.
          docker run --rm \
            -v /tmp/essai/sources:/sources:ro \
            -v /tmp/essai/repository:/repository \
            -v /tmp/essai/etat:/var/lib/heaven \
            "$image" serve --once --schedule 6h --verify-every 1
          test -f /tmp/essai/repository/config.json
          docker run --rm -v /tmp/essai/repository:/repository "$image" \
            snapshots --repository /repository
          # La sonde de santé du conteneur, telle que HEALTHCHECK l'invoque.
          docker run --rm -v /tmp/essai/etat:/var/lib/heaven "$image" health
          docker run --rm \
            -v /tmp/essai/repository:/repository \
            -v /tmp/essai/restauration:/restauration \
            "$image" restore latest --repository /repository --target /restauration
          grep -qx bonjour /tmp/essai/restauration/sources/a.txt

  # L'interface web a son image à elle : elle se construit, se publie et se
  # déploie avec l'appliance, mais ne partage rien avec elle. Ce job est dans
  # le même workflow parce que « Déploiement » attend *ce workflow* — publier
  # l'interface ailleurs redéploierait la pile avant que son image existe.
  image-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Contrôle de bout en bout : nginx sert bien le bundle construit, et non
      # la page d'accueil par défaut de l'image.
      - name: Essayer l'image
        if: github.event_name == 'pull_request'
        run: |
          set -eux
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          # nginx résout « heaven » (proxy_pass) au démarrage : sans l'appliance
          # à côté, un alias suffit — l'essai ne porte que sur le bundle servi.
          docker run -d --name heaven-web-essai -p 8080:80 \
            --add-host heaven:127.0.0.1 "$image"
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/ >/tmp/page.html && break
            sleep 1
          done
          grep -q '<title>Heaven</title>' /tmp/page.html
          grep -qE '<script[^>]+src="/assets/' /tmp/page.html
          docker rm -f heaven-web-essai
