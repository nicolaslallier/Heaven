# Point d'entrée unique de la pile : l'interface Vue, et l'API de Heaven sous
# /api/. Le conteneur « heaven » ne publie aucun port — il n'est joignable que
# par ici, depuis le réseau de la pile.

# DNS interne de Docker. Avec une variable dans proxy_pass, nginx résout « heaven »
# à chaque requête (cache 10 s) au lieu de figer l'IP au démarrage : le
# redéploiement de l'appliance seule ne laisse plus l'interface sur une IP morte.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    # Authentification facultative, désactivée par défaut : si un dossier
    # /etc/nginx/heaven-auth/ est monté avec un fichier *.conf (auth_basic…),
    # il s'applique à toute l'interface et à l'API. Voir docs/portainer.md.
    include /etc/nginx/heaven-auth/*.conf;

    location /api/ {
        # Avec une variable et sans URI, nginx transmet la requête telle quelle :
        # /api/x -> heaven:8000/api/x, comme avant.
        set $upstream http://heaven:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
