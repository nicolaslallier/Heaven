# Point d'entrée unique de la pile : l'interface Vue, et l'API de Heaven sous
# /api/. Le conteneur « heaven » ne publie aucun port — il n'est joignable que
# par ici, depuis le réseau de la pile.
server {
    listen 80;

    location /api/ {
        proxy_pass http://heaven:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
