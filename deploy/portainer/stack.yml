# Pile Heaven pour l'éditeur web de Portainer (Stacks → Add stack → Web editor).
#
# Contrairement à docker-compose.yml, cette pile ne construit rien : elle tire
# une image déjà publiée. Collez ce fichier, renseignez les variables dans
# « Environment variables », puis déployez. Détails : docs/portainer.md.

services:
  heaven:
    image: ${HEAVEN_IMAGE:-ghcr.io/nicolaslallier/heaven:latest}
    container_name: ${HEAVEN_CONTAINER_NAME:-heaven}
    restart: unless-stopped
    environment:
      HEAVEN_SOURCES: ${HEAVEN_SOURCES:-/sources}
      HEAVEN_REPOSITORY: ${HEAVEN_REPOSITORY:-/repository}
      HEAVEN_EXCLUDES: ${HEAVEN_EXCLUDES:-*.tmp,__pycache__,node_modules,.venv}
      HEAVEN_SCHEDULE: ${HEAVEN_SCHEDULE:-02:30}
      HEAVEN_TAG: ${HEAVEN_TAG:-portainer}
      HEAVEN_VERIFY_EVERY: ${HEAVEN_VERIFY_EVERY:-7}
      HEAVEN_KEEP_LAST: ${HEAVEN_KEEP_LAST:-7}
      HEAVEN_KEEP_DAILY: ${HEAVEN_KEEP_DAILY:-7}
      HEAVEN_KEEP_WEEKLY: ${HEAVEN_KEEP_WEEKLY:-4}
      HEAVEN_KEEP_MONTHLY: ${HEAVEN_KEEP_MONTHLY:-6}
      TZ: ${TZ:-Europe/Paris}
      # API en lecture seule, relayée par le service « web » : aucun port publié.
      HEAVEN_LISTEN: 0.0.0.0:8000
    volumes:
      - ${HEAVEN_SOURCES_PATH:-/srv}:/sources:ro
      - ${HEAVEN_REPOSITORY_PATH:-heaven-repository}:/repository
      - heaven-state:/var/lib/heaven
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Seule porte d'entrée : l'interface, et /api/ relayé vers « heaven ».
  #
  # Aucun port publié : la pile est jointe au réseau « infra-net » et c'est le
  # nginx d'Infra qui l'expose, sur https://heaven.infra.famillelallier.net
  # (Infra, nginx/conf.d/heaven.conf). L'API de Heaven n'a pas
  # d'authentification propre : un port hôte la livrerait en lecture à tout le
  # LAN. Le service s'appelle « heaven-web » et non « web » parce que Compose
  # enregistre le nom du service comme alias DNS sur chaque réseau rejoint, et
  # qu'« web » est trop générique pour un réseau partagé par plusieurs piles.
  heaven-web:
    image: ${HEAVEN_WEB_IMAGE:-ghcr.io/nicolaslallier/heaven-web:latest}
    container_name: ${HEAVEN_WEB_CONTAINER_NAME:-heaven-web}
    restart: unless-stopped
    depends_on:
      - heaven
    networks:
      # « default » reste indispensable : c'est par là que nginx joint
      # « heaven:8000 », qui ne sort pas de la pile.
      - default
      - infra-net
    environment:
      TZ: ${TZ:-Europe/Paris}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Créé par la pile Infra (« make init » y crée le réseau) : déclaré externe
  # ici, la pile refuse de démarrer s'il manque plutôt que d'en créer un
  # homonyme isolé, où le nginx d'Infra ne verrait jamais « heaven-web ».
  infra-net:
    external: true

volumes:
  heaven-repository:
  heaven-state:
